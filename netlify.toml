[build]
  publish = "."

# Secondary domains to the primary, permanent, path preserved.
# Add one pair per domain you hold. Netlify also does this automatically once
# freehold.works is set as the primary domain in Domain management, so these
# are belt and braces rather than strictly required.

[[redirects]]
  from = "https://freeholdworks.eu/*"
  to = "https://freehold.works/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://freeholdworks.eu/*"
  to = "https://freehold.works/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://freeholdworks.org/*"
  to = "https://freehold.works/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://freeholdworks.org/*"
  to = "https://freehold.works/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://freeholdworks.online/*"
  to = "https://freehold.works/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://freeholdworks.online/*"
  to = "https://freehold.works/:splat"
  status = 301
  force = true

# www to apex on the primary.
[[redirects]]
  from = "https://www.freehold.works/*"
  to = "https://freehold.works/:splat"
  status = 301
  force = true
